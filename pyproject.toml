[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morph-traider"
version = "0.1.0"
description = "Modular AI-Powered Nobitex Paper-Trading System (Flask WSGI + React/TS Solid-Glass)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.3,<4.0.0",
    "flask-sqlalchemy>=3.1.1,<4.0.0",
    "flask-migrate>=4.0.7,<5.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
